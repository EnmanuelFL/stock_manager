<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <title>StockManager</title>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
        <a class="navbar-brand" href="{% url 'dashboard' %}">StockManager</a>
        <div class="navbar-nav me-auto">
            <a class="nav-link" href="{% url 'dashboard' %}">Dashboard</a>
            <a class="nav-link" href="{% url 'lista_productos' %}">Productos</a>
            <a class="nav-link" href="{% url 'lista_ventas' %}">Ventas</a>
            <a class="nav-link" href="{% url 'lista_compras' %}">Compras</a>
        </div>

        <div class="d-flex align-items-center gap-3">
            {% if user.is_authenticated %}
                <span class="text-light small">Usuario: {{ user.username }}</span>
                <form method="post" action="{% url 'logout' %}" class="mb-0">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-light btn-sm">Cerrar sesión</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm">Iniciar sesión</a>
            {% endif %}
        </div>
    </nav>
    <main class="container my-4">
        {% block content %} {% endblock %}
    </main>
</body>
</html>
